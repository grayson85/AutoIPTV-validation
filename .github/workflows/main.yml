name: update-lives-list

on:
  schedule:
    # Runs at 21:00 UTC daily
    - cron: '0 21 * * *'
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to manually trigger this via the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    # Granting write permission is mandatory for git push to work
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 ensures we have the full history for rebasing
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium requests futures eventlet webdriver-manager

      - name: Run iptv
        run: python iptv.py

      - name: Commit and Push
        run: |
          git config --local user.email "handsheng@gmail.com"
          git config --local user.name "grayson85"
          
          # Stage both m3u and txt files
          git add lives.m3u lives.txt
          
          # Only proceed if there are actual changes
          if ! git diff --staged --quiet; then
            git commit -m "Update list $(date +'%Y-%m-%d %H:%M')"
            
            # This is the fix for the [rejected] error: 
            # It pulls remote changes and puts your new commit on top
            git pull --rebase origin main
            
            # Final push
            git push origin main
          else
            echo "No changes detected, skipping push."
          fi
